<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>놀아 주기 3D 시험 — 키워봐도될까</title>
<!-- 11/3 시험판(js/play3d.js): 터그 놀이(강아지) · 낚싯대 놀이(고양이) — 앱과 같은 코드·같은 아이 GLB(art/3d/pets) -->
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../room.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE4CF; font-family: Pretendard, -apple-system, 'Malgun Gothic', sans-serif; }
  body { position: relative; }
  .res { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; }
  .res b { font-size: 28px; }
  .res .row { display: flex; gap: 10px; justify-content: center; }
</style>
</head><body>
<div class="res" id="res"><b>놀아 주기 3D 시험판</b>
  <p>터그: 줄 끝 빨간 매듭을 잡고 당겨요 · 낚싯대: 마우스(손가락)로 깃털을 흔들고, 고양이 앞 바닥에서 멈춰 봐요</p>
  <div class="row"><button class="btn btn-main" id="tug">터그 놀이 · 중형견 아기</button><button class="btn btn-main" id="wand">낚싯대 놀이 · 단모 고양이 아기</button></div><p id="out"></p></div>
<script type="importmap">{ "imports": { "three": "../../js/vendor/three/three.module.js", "three/addons/": "../../js/vendor/three/addons/" } }</script>
<script type="module">
const { tug3d, wand3d } = await import(`../../js/play3d.js?t=${Date.now()}`);
const res = document.getElementById('res'), out = document.getElementById('out');
const run = async (fn, opt) => {
  res.style.visibility = 'hidden';
  const r = await fn({ ...opt, base: '../../' });   // 11/3부터 앱과 같은 art/3d/pets GLB(놀이 동작 포함)
  res.style.visibility = '';
  out.textContent = r.ok ? `끝까지 놀았어요${r.rough ? ` · 너무 셌던 횟수 ${r.rough}` : ''}` : '그만뒀어요';
};
document.getElementById('tug').onclick = () => run(tug3d, { type: 'medium', stage: 'baby' });
document.getElementById('wand').onclick = () => run(wand3d, { type: 'short', stage: 'baby' });
</script>
</body></html>
